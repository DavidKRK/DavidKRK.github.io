name: 🛠️ Maintenance - Liens, Backup & Stale Issues

on:
  schedule:
    # Vérification des liens morts chaque lundi à 8h UTC
    - cron: '0 8 * * 1'
    # Backup complet chaque dimanche à 1h UTC
    - cron: '0 1 * * 0'
  # Déclenchement manuel du workflow
  workflow_dispatch:

# Permissions minimales pour les opérations de maintenance
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────────────────────
  # LUNDI : Vérification des liens morts avec Lychee
  # ─────────────────────────────────────────────────────────────
  check-links:
    name: 🔗 Vérification des liens morts (Lychee)
    runs-on: ubuntu-latest
    # Exécuter uniquement le cron du lundi, ou lors d'un déclenchement manuel
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 8 * * 1')

    steps:
      # Récupérer le contenu du site publié (branche gh-pages) pour scanner ses liens
      - name: Checkout du dépôt
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: gh-pages

      # Lancer Lychee pour vérifier tous les liens dans les fichiers HTML et Markdown
      # La configuration est définie dans .lychee.toml (exclusions : mailto, soundcloud, etc.)
      - name: Vérification des liens avec Lychee
        id: lychee
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: >
            --verbose
            --no-progress
            --config .lychee.toml
            --timeout 20
            --max-retries 2
            '**/*.html'
            '**/*.md'
          # Ne pas faire échouer le workflow (on crée une issue à la place)
          fail: false

      # S'assurer que les labels requis existent avant de créer l'issue
      - name: Créer les labels si absents
        if: steps.lychee.outputs.exit_code != 0
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const requiredLabels = [
              { name: 'bug',         color: 'd73a4a', description: 'Un problème a été identifié' },
              { name: 'maintenance', color: 'e4e669', description: 'Tâche de maintenance' },
              { name: 'automated',   color: 'ededed', description: 'Créée automatiquement par un workflow' }
            ];
            for (const label of requiredLabels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name
                });
              } catch (err) {
                if (err.status === 404) {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description
                  });
                } else {
                  throw err;
                }
              }
            }

      # Créer une issue si des liens morts ont été trouvés
      - name: Créer une issue si des liens morts sont détectés
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: '🔗 Liens morts détectés sur davidkrk.com'
          content-filepath: ./lychee/out.md
          labels: bug, maintenance, automated

      # Sauvegarder le rapport complet en artefact
      - name: Sauvegarder le rapport Lychee
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lychee-report-${{ github.run_id }}
          path: lychee/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # DIMANCHE : Backup complet dans GitHub Releases
  # ─────────────────────────────────────────────────────────────
  backup:
    name: 💾 Backup hebdomadaire (GitHub Releases)
    runs-on: ubuntu-latest
    # Exécuter uniquement le cron du dimanche ou un déclenchement manuel
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 1 * * 0')
    permissions:
      contents: write

    steps:
      # Récupérer le contenu du site publié (branche gh-pages) pour l'archiver
      - name: Checkout complet du dépôt
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: gh-pages
          fetch-depth: 0

      # Créer une archive compressée du site (en excluant .git et node_modules)
      - name: Générer l'archive de backup
        id: archive
        run: |
          DATE=$(date +%Y-%m-%d)
          ARCHIVE_NAME="davidkrk-backup-${DATE}.tar.gz"
          # Écrire l'archive hors du répertoire courant pour éviter "file changed as we read it"
          ARCHIVE_PATH="${RUNNER_TEMP}/${ARCHIVE_NAME}"

          tar -czf "$ARCHIVE_PATH" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            .

          ARCHIVE_SIZE=$(du -sh "$ARCHIVE_PATH" | cut -f1)
          echo "archive_name=$ARCHIVE_PATH" >> "$GITHUB_OUTPUT"
          echo "archive_size=$ARCHIVE_SIZE" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "✅ Archive créée : $ARCHIVE_NAME ($ARCHIVE_SIZE)"

      # Publier l'archive dans une GitHub Release taguée
      - name: Publier le backup dans GitHub Releases
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: backup-${{ steps.archive.outputs.date }}
          name: "💾 Backup hebdomadaire — ${{ steps.archive.outputs.date }}"
          body: |
            ## 🗄️ Backup automatique hebdomadaire

            | Champ | Valeur |
            |-------|--------|
            | 📅 Date | ${{ steps.archive.outputs.date }} |
            | 📦 Taille | ${{ steps.archive.outputs.archive_size }} |
            | 🔁 Run | #${{ github.run_number }} |
            | 🌿 Branche | `${{ github.ref_name }}` |

            Ce backup contient un instantané complet du site davidkrk.com.
            Les backups sont conservés automatiquement pour permettre une restauration rapide.
          files: ${{ steps.archive.outputs.archive_name }}
          draft: false
          prerelease: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────
  # LUNDI + DIMANCHE : Fermeture automatique des issues inactives (Stale)
  # ─────────────────────────────────────────────────────────────
  stale:
    name: 🧹 Fermeture des issues inactives (Stale)
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      # Marquer les issues sans activité depuis 60 jours comme "stale"
      # et les fermer automatiquement après 7 jours supplémentaires
      - name: Gérer les issues et PR inactives
        uses: actions/stale@v10
        with:
          # ── Issues ──────────────────────────────────────────
          days-before-issue-stale: 60
          days-before-issue-close: 7
          stale-issue-label: 'stale'
          stale-issue-message: |
            👋 Cette issue n'a pas eu d'activité depuis **60 jours**.
            Elle sera automatiquement fermée dans **7 jours** si aucune réponse n'est apportée.

            Si le sujet est toujours d'actualité, merci de laisser un commentaire pour maintenir l'issue ouverte.
          close-issue-message: |
            🔒 Cette issue a été fermée automatiquement après **67 jours** d'inactivité.
            Elle peut être réouverte si nécessaire.

          # ── Pull Requests ────────────────────────────────────
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-label: 'stale'
          stale-pr-message: |
            👋 Cette Pull Request n'a pas eu d'activité depuis **30 jours**.
            Elle sera automatiquement fermée dans **7 jours** si aucune mise à jour n'est effectuée.
          close-pr-message: |
            🔒 Cette Pull Request a été fermée automatiquement après **37 jours** d'inactivité.
            Elle peut être réouverte si nécessaire.

          # ── Exclusions ───────────────────────────────────────
          exempt-issue-labels: 'pinned,security,urgent,uptime,in-progress'
          exempt-pr-labels: 'pinned,security,do-not-merge,in-progress'
          operations-per-run: 30
          remove-stale-when-updated: true
