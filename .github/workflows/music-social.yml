name: 🎵 Mise à jour musicale - Notification & Réseaux Sociaux

on:
  push:
    branches: [main, gh-pages]
    # Déclencher uniquement quand music.html est modifié
    paths:
      - 'music.html'
  # Déclenchement manuel pour tester le workflow
  workflow_dispatch:

# Permissions minimales : lecture du code + création d'issues
permissions:
  contents: read
  issues: write

jobs:
  detect-music-update:
    name: Détecter les changements dans music.html
    runs-on: ubuntu-latest

    steps:
      # Récupérer le code source avec l'historique complet pour comparer tout le push
      - name: Checkout du dépôt
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 0

      # Extraire les changements apportés à music.html depuis le dernier commit
      - name: Analyser les modifications de music.html
        id: diff
        run: |
          # Sur un push, comparer la plage exacte de commits de l'événement.
          # En exécution manuelle (workflow_dispatch), revenir au commit précédent.
          if [ "${{ github.event_name }}" = "push" ] && \
             [ -n "${{ github.event.before }}" ] && \
             [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            DIFF=$(git diff "${{ github.event.before }}" "${{ github.sha }}" -- music.html)
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            DIFF=$(git diff HEAD^ HEAD -- music.html)
          else
            EMPTY_TREE=$(git hash-object -t tree /dev/null)
            DIFF=$(git diff "$EMPTY_TREE" HEAD -- music.html)
          fi

          # Extraire les lignes ajoutées (nouvelles entrées)
          ADDED=$(echo "$DIFF" | grep "^+" | grep -v "^+++" | sed 's/^+//' | head -50)

          # Compter les lignes modifiées en excluant les en-têtes de diff (+++ / ---)
          LINES_ADDED=$(echo "$DIFF" | grep "^+" | grep -v "^+++" | wc -l)
          LINES_REMOVED=$(echo "$DIFF" | grep "^-" | grep -v "^---" | wc -l)

          # Sauvegarder les infos dans les outputs
          echo "lines_added=$LINES_ADDED" >> "$GITHUB_OUTPUT"
          echo "lines_removed=$LINES_REMOVED" >> "$GITHUB_OUTPUT"

          # Sauvegarder le diff dans un fichier temporaire pour l'issue
          echo "$ADDED" > /tmp/music_changes.txt

          # Détecter la présence de nouveaux titres (balises audio ou liens)
          if echo "$DIFF" | grep -qiE '(audio|track|mix|set|release|soundcloud|youtube)'; then
            echo "has_music_content=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_music_content=false" >> "$GITHUB_OUTPUT"
          fi

      # Créer une issue GitHub récapitulative de la mise à jour musicale
      - name: Créer une issue "New Music Update"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        env:
          LINES_ADDED: ${{ steps.diff.outputs.lines_added }}
          LINES_REMOVED: ${{ steps.diff.outputs.lines_removed }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
        with:
          script: |
            const sha = process.env.COMMIT_SHA || '';
            const shortSha = sha.slice(0, 7);
            const defaultCommitMsg = 'Mise à jour manuelle';
            const commitMsg = (process.env.COMMIT_MSG || defaultCommitMsg)
              .split('\n')
              .find(line => line.trim().length > 0) || defaultCommitMsg;
            const author = process.env.COMMIT_AUTHOR || 'DavidKRK';
            const linesAdded = process.env.LINES_ADDED;
            const linesRemoved = process.env.LINES_REMOVED;
            const now = new Date().toLocaleString('fr-FR', { timeZone: 'Europe/Paris' });

            // ─────────────────────────────────────────
            // Template de post pour réseaux sociaux
            // ─────────────────────────────────────────
            const socialTemplate = [
              '## 📱 Template de post pour réseaux sociaux',
              '',
              '### Instagram / Facebook',
              '```',
              '🎵 Nouvelle mise à jour sur mon site !',
              '',
              '🔥 Nouveau contenu musical disponible sur www.davidkrk.com',
              '',
              '🎧 DJ & Producteur Techno depuis 1999',
              '📍 Saint-Jean-de-Luz, France',
              '',
              '#DavidKRK #Techno #DJ #Music #NewRelease #TechnoMusic #Underground',
              '#BasqueCountry #SaintJeanDeLuz #ElectronicMusic',
              '```',
              '',
              '### Twitter / X',
              '```',
              '🎵 Nouveau contenu musical sur https://davidkrk.com !',
              '#DavidKRK #Techno #DJ #NewMusic',
              '```',
              '',
              '### SoundCloud / Bandcamp',
              '```',
              '🔥 New track/mix available! Check it out on www.davidkrk.com',
              '#techno #underground #dj #producer #saintjeandeLuz',
              '```',
            ].join('\n');

            // ─────────────────────────────────────────
            // Contenu principal de l'issue
            // ─────────────────────────────────────────
            const issueBody = [
              '## 🎵 Mise à jour de la page musicale détectée',
              '',
              '### 📋 Détails du commit',
              `- **Commit** : [\`${shortSha}\`](https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${context.payload.head_commit?.id || sha})`,
              `- **Message** : ${commitMsg}`,
              `- **Auteur** : ${author}`,
              `- **Date** : ${now} (heure de Paris)`,
              `- **Lignes modifiées** : +${linesAdded} / -${linesRemoved}`,
              '',
              '### 🔗 Liens utiles',
              `- 🌐 [Voir music.html en ligne](https://www.davidkrk.com/music.html)`,
              `- 📝 [Voir le diff sur GitHub](https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${context.payload.head_commit?.id || sha})`,
              '',
              '---',
              '',
              socialTemplate,
              '',
              '---',
              '',
              '### ✅ Checklist de publication',
              '- [ ] Vérifier que le nouveau contenu est visible sur [davidkrk.com/music.html](https://www.davidkrk.com/music.html)',
              '- [ ] Poster sur Instagram',
              '- [ ] Poster sur Facebook',
              '- [ ] Poster sur Twitter / X',
              '- [ ] Partager sur SoundCloud si nouveau mix/track',
              '- [ ] Mettre à jour la bio si nécessaire',
              '',
              '_Issue créée automatiquement par le workflow music-social._'
            ].join('\n');

            // S'assurer que les labels requis existent avant de créer l'issue
            const requiredLabels = [
              { name: 'music',        color: '1d76db', description: 'Mise à jour musicale' },
              { name: 'social-media', color: 'bfd4f2', description: 'Post réseaux sociaux' },
              { name: 'automated',    color: 'ededed', description: 'Créée automatiquement par un workflow' }
            ];
            for (const label of requiredLabels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name
                });
              } catch (err) {
                if (err.status === 404) {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description
                  });
                } else {
                  throw err;
                }
              }
            }

            // Créer l'issue de notification
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🎵 New Music Update — ${now}`,
              body: issueBody,
              labels: requiredLabels.map(l => l.name)
            });

            console.log('✅ Issue "New Music Update" créée avec succès !');
