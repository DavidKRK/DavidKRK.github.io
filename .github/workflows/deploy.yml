name: Deploy David KRK Site

on:
  push:
    branches: [gh-pages]
    paths-ignore:
      - '.github/badges/**'
      - '*.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build & Upload
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Copier tout le site dans dist/
        run: |
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='*.md' \
            --exclude='Gemfile*' \
            --exclude='package*.json' \
            --exclude='*.code-workspace' \
            --exclude='*.toml' \
            --exclude='*.txt' \
            --exclude='.gitignore' \
            --exclude='.gitleaks.toml' \
            --exclude='.lychee.toml' \
            --exclude='.lighthouserc.json' \
            --exclude='.bundle' \
            . dist/

      - name: Build optimized assets (minify CSS + JS)
        run: npm run build

      - name: Remplacer les assets par leurs versions minifiees
        run: |
          # Remplacer le CSS original par la version minifiee
          if [ -f "dist/assets/css/style.min.css" ]; then
            cp dist/assets/css/style.min.css dist/assets/css/style.css
          fi
          # Remplacer le JS original par la version minifiee
          if [ -f "dist/assets/js/main.min.js" ]; then
            cp dist/assets/js/main.min.js dist/assets/js/main.js
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
