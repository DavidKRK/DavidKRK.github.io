name: YouTube Auto-Sync

on:
  schedule:
    # Verifie les nouvelles videos tous les jours a 10h UTC (12h CEST)
    - cron: '0 6,12,18,0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  youtube-sync:
    name: Sync dernieres videos YouTube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: gh-pages

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Installer les dependances
        run: pip install requests

      - name: Creer le dossier data si necessaire
        run: mkdir -p assets/data

      - name: Recuperer les dernieres videos YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        shell: bash
        run: |
          python <<'PY'
          import html
          import json
          import os
          import re
          import requests

          api_key = os.environ.get('YOUTUBE_API_KEY', '')
          if not api_key:
              print('YOUTUBE_API_KEY non configure - abandon')
              exit(0)

          channel_handle = 'DavidKRKofficial'

          search_url = (
              'https://www.googleapis.com/youtube/v3/search'
              '?key=' + api_key
              + '&q=' + channel_handle
              + '&type=channel&part=snippet&maxResults=1'
          )
          r = requests.get(search_url, timeout=30)
          data = r.json()

          if 'items' not in data or len(data['items']) == 0:
              print('Erreur: chaine YouTube introuvable')
              print(data)
              exit(1)

          channel_id = data['items'][0]['snippet']['channelId']
          print('Channel ID trouve: ' + channel_id)

          videos_url = (
              'https://www.googleapis.com/youtube/v3/search'
              '?key=' + api_key
              + '&channelId=' + channel_id
              + '&part=snippet,id&order=date&maxResults=50&type=video'
          )
          r2 = requests.get(videos_url, timeout=30)
          videos = r2.json()

          if 'items' not in videos:
              print('Erreur: impossible de recuperer les videos')
              print(videos)
              exit(1)

          youtube_id_re = re.compile(r'^[A-Za-z0-9_-]{11}$')
          placeholder_titles = {'test', 'placeholder'}
          video_list = []
          for item in videos['items']:
              video_id = item.get('id', {}).get('videoId', '').strip()
              if not youtube_id_re.match(video_id):
                  print('Vidéo ignorée (id YouTube invalide): ' + repr(video_id))
                  continue
              title = html.unescape(item['snippet']['title']).strip()
              if title.casefold() in placeholder_titles:
                  print('Vidéo ignorée (titre de test exact): ' + video_id)
                  continue
              thumb = item['snippet']['thumbnails']['high']['url']
              published = item['snippet']['publishedAt'][:10]
              video_list.append({
                  'id': video_id,
                  'title': title,
                  'thumbnail': thumb,
                  'published': published,
                  'url': 'https://www.youtube.com/watch?v=' + video_id
              })

          with open('assets/data/youtube-videos.json', 'w', encoding='utf-8') as f:
              json.dump(video_list, f, ensure_ascii=False, indent=2)

          print(str(len(video_list)) + ' videos sauvegardees dans assets/data/youtube-videos.json')
          for v in video_list:
              print(' - [' + v['published'] + '] ' + v['title'])
          PY

      - name: Injecter les videos dans music.html
        shell: bash
        run: |
          python <<'PY'
          import html
          import json
          import os
          import re

          if not os.path.exists('assets/data/youtube-videos.json'):
              print('Fichier youtube-videos.json introuvable - abandon')
              exit(0)

          with open('assets/data/youtube-videos.json', 'r', encoding='utf-8') as f:
              videos = json.load(f)

          youtube_id_re = re.compile(r'^[A-Za-z0-9_-]{11}$')
          placeholder_titles = {'test', 'placeholder'}

          cards = ''
          for v in videos:
              video_id = (v.get('id') or '').strip()
              title = (v.get('title') or '').strip()
              url = (v.get('url') or '').strip()
              thumbnail = (v.get('thumbnail') or '').strip()
              published = (v.get('published') or '').strip()

              if not video_id or video_id == 'placeholder':
                  continue
              if not youtube_id_re.match(video_id):
                  continue
              if title.casefold() in placeholder_titles:
                  continue
              if not url or 'placeholder' in url:
                  continue
              if not thumbnail:
                  continue
              if not published:
                  continue

              safe_url = html.escape(url, quote=True)
              safe_thumbnail = html.escape(thumbnail, quote=True)
              safe_title = html.escape(title)
              safe_published = html.escape(published)
              cards += (
                  '<a href="' + safe_url + '" target="_blank" rel="noopener noreferrer" class="yt-card">'
                  '<div class="yt-thumb">'
                  '<img src="' + safe_thumbnail + '" alt="" loading="lazy" width="320" height="180">'
                  '<span class="yt-play">&#9654;</span>'
                  '</div>'
                  '<p class="yt-title">' + safe_title + '</p>'
                  '<span class="yt-date">' + safe_published + '</span>'
                  '</a>'
              )

          channel_link = ('<a href="https://www.youtube.com/@DavidKRKofficial"'
                          ' target="_blank" rel="noopener noreferrer"'
                          ' class="yt-channel-link">&#127909; <span id="youtube-btn-text">Voir toutes les vidéos</span></a>')

          youtube_block = (
              '<!-- YOUTUBE-AUTO-START -->\n'
              '      <h2 id="youtube-section-title">YouTube</h2>\n'
              '      <div class="yt-grid">\n'
              '        ' + channel_link + '\n'
              '        <div class="yt-cards">' + cards + '</div>\n'
              '      </div>\n'
              '      <!-- YOUTUBE-AUTO-END -->'
          )

          with open('music.html', 'r', encoding='utf-8') as f:
              content = f.read()

          pattern = r'<!-- YOUTUBE-AUTO-START -->.*?<!-- YOUTUBE-AUTO-END -->'
          if re.search(pattern, content, re.DOTALL):
              content = re.sub(pattern, youtube_block, content, flags=re.DOTALL)
          else:
              content = content.replace('</main>', youtube_block + '\n    </main>')

          with open('music.html', 'w', encoding='utf-8') as f:
              f.write(content)
          print('music.html mis a jour !')

          css_marker = '/* === YouTube Auto-Section === */'
          css_path = 'assets/css/style.css'
          if os.path.exists(css_path):
              with open(css_path, 'r', encoding='utf-8') as f:
                  existing = f.read()
              if css_marker not in existing:
                  css_content = (
                      '\n' + css_marker + '\n'
                      '.yt-grid { max-width: 960px; margin: 2rem auto; padding: 0 1rem; text-align: center; }\n'
                      '.yt-channel-link { display: inline-block; margin-bottom: 1.5rem; color: #ff0000; font-weight: bold; font-size: 1.1rem; text-decoration: none; }\n'
                      '.yt-channel-link:hover { opacity: 0.8; }\n'
                      '.yt-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.2rem; }\n'
                      '.yt-card { display: flex; flex-direction: column; background: rgba(0,0,0,0.45); border-radius: 10px; overflow: hidden; text-decoration: none; color: #fff; transition: transform 0.2s ease, box-shadow 0.2s ease; }\n'
                      '.yt-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(255,0,0,0.2); }\n'
                      '.yt-thumb { position: relative; }\n'
                      '.yt-thumb img { width: 100%; height: 180px; object-fit: cover; display: block; }\n'
                      '.yt-play { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 2.5rem; opacity: 0.85; pointer-events: none; }\n'
                      '.yt-title { padding: 0.6rem 0.8rem 0.2rem; font-size: 0.9rem; font-weight: 600; text-align: left; }\n'
                      '.yt-date { padding: 0 0.8rem 0.8rem; font-size: 0.75rem; color: #aaa; text-align: left; }\n'
                  )
                  with open(css_path, 'a', encoding='utf-8') as f:
                      f.write(css_content)
                  print('CSS YouTube ajoute a style.css')
              else:
                  print('CSS YouTube deja present')
          PY

      - name: Commit et push si changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/youtube-videos.json music.html assets/css/style.css
          if git diff --staged --quiet; then
            echo "Aucune nouvelle video detectee."
          else
            git commit -m "Auto-sync: mise a jour des videos YouTube $(date +%Y-%m-%d)"
            git push
            echo "Videos mises a jour et poussees !"
          fi
