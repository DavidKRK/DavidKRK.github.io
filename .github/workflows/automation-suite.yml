name: Automation Suite - Dependencies & Optimization

on:
  schedule:
    # Mise a jour des dependances chaque lundi a 9h (UTC)
    - cron: '0 9 * * 1'
  push:
    branches: [gh-pages]
    paths:
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  update-dependencies:
    name: Mise a jour des dependances npm
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Update dependencies
        run: |
          npm update
          npm audit fix || true

      - name: Get current date
        id: get_date
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: |
            package.json
            package-lock.json
          commit-message: 'chore: mise a jour automatique des dependances npm'
          title: 'Mise a jour automatique des dependances'
          body: |
            Mise a jour automatique des dependances npm effectuee le ${{ steps.get_date.outputs.date }}

            - Dependances mises a jour via npm update
            - Corrections de securite appliquees via npm audit fix

            Merci de verifier les changements avant de fusionner.
          branch: auto-update-dependencies
          delete-branch: true

  optimize-images:
    name: Optimisation des images
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Compress Images
        uses: calibreapp/image-actions@f32575787d333b0579f0b7d506ff03be63a669d1 # 1.4.1
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          compressOnly: true
          jpegQuality: '85'
          pngQuality: '85'
          webpQuality: '85'

  check-links:
    name: Verification des liens morts
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Check for broken links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --config .lychee.toml '**/*.html' '**/*.md'
          fail: false

      - name: Create issue if broken links found
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: 'Liens morts detectes sur le site'
          content-filepath: ./lychee/out.md
          labels: bug, maintenance
