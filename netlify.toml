# Link checker: skip preconnect checks for Google Fonts (TLS cannot be verified from the build environment)
[[plugins]]
  package = "netlify-plugin-checklinks"
  [plugins.inputs]
    skipPatterns = [
      "preconnect-check https://fonts.googleapis.com",
      "preconnect-check https://fonts.gstatic.com",
      "https://fonts.googleapis.com",
      "https://fonts.gstatic.com",
    ]

# Override the UI-installed Checklinks plugin for Deploy Previews only.
# Keep the checks visible; tolerate failures only for these preconnect reports.
[[context.deploy-preview.plugins]]
package = "netlify-plugin-checklinks"

[context.deploy-preview.plugins.inputs]
todoPatterns = [
  "preconnect-check https://fonts.googleapis.com",
  "preconnect-check https://fonts.gstatic.com",
]
